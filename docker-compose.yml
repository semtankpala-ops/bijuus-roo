services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bijuus_roo}
      POSTGRES_USER: ${POSTGRES_USER:-bijuus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - bijuus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bijuus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bijuus_roo}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bijuus.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
    ports:
      - "3000:3000"

volumes:
  bijuus_pg:
